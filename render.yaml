services:
  - type: web
    name: xeno-crm-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: CHANNEL_SERVICE_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./xeno_crm.db
      - key: APP_ENV
        value: production
